# ---------------------------------------------------------------------------
# Cloudflare Workers 部署检查
#
#   1. build-check：每次 push / PR 都跑 —— 类型检查 + wrangler dry-run 构建，
#      提前发现编译错误、wrangler.toml 配置错误，不会真正部署。
#   2. deploy-check：只在仓库 Secrets 里配置了
#      CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID 时才真正部署一次
#      （复用 scripts/deploy.mjs，自动复用/创建 KV 与 R2）。
#      没配 secrets 时自动跳过，不影响 PR 检查。
# ---------------------------------------------------------------------------
name: Cloudflare Workers Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-check:
    name: 构建 + dry-run 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 类型检查
        run: npm run typecheck

      - name: 构建 + dry-run 检查（含拉取官方前端）
        run: npm run build

  deploy-check:
    name: 真实部署检查
    runs-on: ubuntu-latest
    needs: build-check
    if: github.event_name != 'pull_request'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install

      - name: 检查是否已配置部署凭据
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets，跳过真实部署检查"
          fi

      - name: 真实部署（自动复用/创建 KV、R2）
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/deploy.mjs
